databaseChangeLog:
  - changeSet:
      id: 001-schema
      author: corporate
      changes:
        - createTable:
            tableName: company
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: logo_url
                  type: varchar(512)

        - createTable:
            tableName: employee
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: company_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_employee_company
                    references: company(id)
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: int
                  constraints:
                    nullable: false

        - createTable:
            tableName: merchant
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: logo_url
                  type: varchar(512)
              - column:
                  name: description
                  type: text

        - createTable:
            tableName: offer
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: merchant_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_offer_merchant
                    references: merchant(id)
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: image_url
                  type: varchar(512)
              - column:
                  name: points_price
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - createTable:
            tableName: benefit_application
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: employee_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_application_employee
                    references: employee(id)
              - column:
                  name: offer_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_application_offer
                    references: offer(id)
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: voucher_code
                  type: varchar(64)
                  constraints:
                    unique: true
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: decided_at
                  type: timestamp with time zone

        - createTable:
            tableName: point_transaction
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: employee_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transaction_employee
                    references: employee(id)
              - column:
                  name: amount
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
