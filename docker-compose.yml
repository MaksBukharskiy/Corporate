services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corporate_benefits
      POSTGRES_USER: corporate
      POSTGRES_PASSWORD: corporate
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corporate -d corporate_benefits"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/corporate_benefits
      SPRING_DATASOURCE_USERNAME: corporate
      SPRING_DATASOURCE_PASSWORD: corporate
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
